name: Updater

on:
  schedule:
    - cron: '5 11 * * 0'
  workflow_dispatch:
    inputs:
      force_orphan_generated:
        type: boolean
        description: 'Force orphan generated branch'
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          pull: true
          load: true
          tags: asn2ipr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run
        run: |
          set -e
          docker network create --ipv6 work || echo "Already exists"
          docker run --rm -v $PWD/source:/workdir \
            -v $PWD/out:/out \
            --network work \
            asn2ipr
          docker network rm work || echo "Failed to remove"
      
      - name: Get Timestamp
        id: timestamp
        run:
          echo "timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Save generated
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: generated
          publish_dir: ./out
          force_orphan: ${{ inputs.force_orphan_generated }}
          enable_jekyll: true # .nojekyll is not needed
          full_commit_message: ${{ steps.timestamp.outputs.timestamp }}

